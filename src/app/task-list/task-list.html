<section class="card">
  <div class="head">
    <h2>Mes tâches</h2>
    <div class="actions">
      <button class="btn ghost" (click)="clear()">Vider la liste</button>
      <button class="btn" (click)="restore()">Restaurer</button>
    </div>
  </div>

  @if (tasks.length === 0) {
    <p class="empty">Aucune tâche pour l’instant</p>
  } @else {
    <ul>
      @for (task of tasks; track task.id) {
        <li [class.done]="task.completed">
          <div class="info">
            <span class="title">{{ task.title | uppercase }}</span>
            @if (task.dueDate) {
              <small>Échéance : {{ task.dueDate | date: 'dd/MM/yyyy' }}</small>
            }
          </div>
          <span class="badge badge-{{ task.priority }}">{{ task.priority }}</span>
        </li>
      }
    </ul>
  }
</section>
